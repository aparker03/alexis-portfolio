<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- Restore pretty URL after GitHub Pages 404 redirect -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var p = params.get("p");
          if (p) history.replaceState(null, "", p);
        } catch (e) {}
      })();
    </script>

    <meta
      name="description"
      content="Portfolio of Alexis Parker – data science, health analytics, and interactive apps."
    />
    <meta name="author" content="Alexis Parker" />

    <!-- Structured Data (JSON-LD for SEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Alexis Parker",
      "url": "https://alexis-parker.com/",
      "image": "https://alexis-parker.com/preview.png",
      "jobTitle": "Data Scientist",
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "University of Michigan"
      },
      "sameAs": [
        "https://www.linkedin.com/in/alexis-parker-732b9a165",
        "https://github.com/aparker03"
      ],
      "knowsAbout": [
        "Data Science",
        "Machine Learning",
        "Neuroscience",
        "Health Analytics",
        "Visualization",
        "Interactive Apps"
      ],
      "publisher": {
        "@type": "Organization",
        "name": "Alexis Parker Portfolio",
        "url": "https://alexis-parker.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://alexis-parker.com/preview.png"
        }
      }
    }
    </script>

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph (for LinkedIn/Facebook) -->
    <meta property="og:title" content="Alexis Parker · Data Scientist" />
    <meta
      property="og:description"
      content="Explore projects, apps, and experience in data science and health analytics."
    />
    <meta property="og:image" content="%PUBLIC_URL%/preview.png" />
    <meta property="og:url" content="https://alexis-parker.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alexis Parker · Data Scientist" />
    <meta
      name="twitter:description"
      content="Explore projects, apps, and experience in data science and health analytics."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/preview.png" />

    <!-- Prevent browser scroll restoration on navigation/refresh -->
    <script>
      try {
        if ("scrollRestoration" in history) {
          history.scrollRestoration = "manual";
        }
      } catch (e) {}
    </script>

    <title>Alexis Parker · Data Scientist</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- CRA injects your bundled script(s) here -->
  </body>
</html>
