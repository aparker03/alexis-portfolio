<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var l = window.location;
        var dest = "/?p=" + encodeURIComponent(l.pathname + l.search + l.hash);
        l.replace(dest);
      })();
    </script>
    <noscript>
      This page requires JavaScript. <a href="/">Return to home</a>.
    </noscript>
  </head>
  <body></body>
</html>
